services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inorganic_chemistry
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inorganic_chemistry"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
