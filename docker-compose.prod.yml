services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      public-net:
        ipv4_address: 172.30.0.2
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [public-net]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose: ["8000"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      SESSION_COOKIE_SECURE: "true"
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-604800}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-2592000}
      SESSION_COOKIE_NAME: __Host-inorganic_session
      CSRF_COOKIE_NAME: __Host-inorganic_csrf
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [public-net, internal-net]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mail-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "inorganic_api.mail_worker"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      SESSION_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 50
    logging: *default-logging
    networks: [public-net, internal-net]
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner MIGRATION_DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
    logging: *default-logging
    networks: [internal-net]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=2775
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal-net]

  seed:
    profiles: [setup]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "inorganic_api.cli", "seed-accounts"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner MIGRATION_DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_TESTER_USERNAME: ${SEED_TESTER_USERNAME:-}
      SEED_TESTER_PASSWORD: ${SEED_TESTER_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
    logging: *default-logging
    networks: [internal-net]
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  public-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal-net:
    internal: true

volumes:
  pg-data:
  caddy-data:
  caddy-config:
