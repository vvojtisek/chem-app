services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      public-net:
        ipv4_address: 172.30.0.2
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ghcr.io/vvojtisek/chem-app-web:stable
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [public-net]

  api:
    image: ghcr.io/vvojtisek/chem-app-api:stable
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    expose: ["8000"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      SESSION_COOKIE_SECURE: "true"
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-604800}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-2592000}
      SESSION_COOKIE_NAME: __Host-inorganic_session
      CSRF_COOKIE_NAME: __Host-inorganic_csrf
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      RELEASE_CHECK_REPOSITORY: ${RELEASE_CHECK_REPOSITORY-vvojtisek/chem-app}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [public-net, internal-net, update-net]
    depends_on:
      migrate:
        condition: service_healthy

  mail-worker:
    image: ghcr.io/vvojtisek/chem-app-api:stable
    command: ["python", "-m", "inorganic_api.mail_worker"]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      SESSION_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 50
    logging: *default-logging
    # The image's default HTTP healthcheck targets the API; the worker instead
    # touches a heartbeat file after every outbox poll.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/mail-worker-heartbeat') > 120)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [public-net, internal-net]
    depends_on:
      migrate:
        condition: service_healthy

  # Applies migrations, then stays up and reports healthy only after they
  # succeed. api and mail-worker wait for it, and Watchtower updates it before
  # them, so a new schema is in place before new application code starts.
  migrate:
    image: ghcr.io/vvojtisek/chem-app-api:stable
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        touch /tmp/migrated
        trap 'exit 0' TERM INT
        sleep infinity &
        wait
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migrated"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5m
    environment:
      APP_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner MIGRATION_DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
    logging: *default-logging
    networks: [internal-net]
    depends_on:
      db:
        condition: service_healthy

  # Applies published images only when the API asks it to (ADR 0012). It has
  # the Docker socket, which is root-equivalent on the host, so its HTTP API is
  # reachable only from api over update-net, requires a token, and exposes
  # only the update endpoint. It never touches caddy or db (no enable label).
  watchtower:
    image: nickfedor/watchtower:1.23.0@sha256:45b54f6dc15227cfb38dbb826f2881aa0f56aaf0c255cdbb38bd80e598bdca9a
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?Set WATCHTOWER_HTTP_API_TOKEN in .env.production}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_USE_COMPOSE_DEPENDS_ON: "true"
      WATCHTOWER_CLEANUP: "true"
    expose: ["8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 50
    logging: *default-logging
    networks: [update-net]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=2775
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 150
    logging: *default-logging
    healthcheck:
      # TCP probe: during first-time init the bootstrap server listens only on
      # the Unix socket, so a socket probe would report ready too early.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [internal-net]

  seed:
    profiles: [setup]
    image: ghcr.io/vvojtisek/chem-app-api:stable
    command: ["python", "-m", "inorganic_api.cli", "seed-accounts"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner MIGRATION_DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      FORWARDED_ALLOW_IPS: 172.30.0.2
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.production}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_TESTER_USERNAME: ${SEED_TESTER_USERNAME:-}
      SEED_TESTER_PASSWORD: ${SEED_TESTER_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
    logging: *default-logging
    networks: [internal-net]
    depends_on:
      migrate:
        condition: service_healthy

networks:
  public-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come only from the upper half, so Caddy's fixed
          # 172.30.0.2 (trusted by FORWARDED_ALLOW_IPS) is never taken by a
          # container that starts before it.
          ip_range: 172.30.0.128/25
  internal-net:
    internal: true
  # Shared only by api and watchtower. Not internal: Watchtower compares image
  # digests with GHCR itself.
  update-net:

volumes:
  pg-data:
  caddy-data:
  caddy-config:
