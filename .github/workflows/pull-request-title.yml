name: Pull request title

# The squash-merge commit on main uses the pull request title, and the release
# workflow derives the next version from it, so the title must be a valid
# Conventional Commit before merge.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pull-request-title.mjs
