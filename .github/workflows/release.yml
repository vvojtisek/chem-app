name: Release

# release-please keeps one open release pull request that bumps the version and
# CHANGELOG.md from the Conventional Commit subjects merged since the last
# release. Merging that pull request tags the commit and publishes the GitHub
# Release. This workflow never builds or deploys anything.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
