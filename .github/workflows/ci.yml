name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv --directory apps/api sync --frozen --extra test

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: |
          pnpm lint
          uv --directory apps/api run ruff format --check .
          uv --directory apps/api run ruff check .

      - name: Type checking
        run: pnpm typecheck

      - name: Unit and integration tests
        run: |
          pnpm test
          uv --directory apps/api run pytest -q

      - name: Content and contracts
        run: |
          pnpm content:validate
          pnpm contracts:check

      - name: Production build
        run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm --filter @inorganic/web build

      - name: Browser tests
        run: pnpm test:e2e
