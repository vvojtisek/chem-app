name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inorganic_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inorganic_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inorganic_api_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv --directory apps/api sync --frozen --extra test

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: |
          pnpm lint
          uv --directory apps/api run ruff format --check .
          uv --directory apps/api run ruff check .

      - name: Type checking
        run: pnpm typecheck

      - name: Unit and integration tests
        run: |
          pnpm test
          uv --directory apps/api run pytest -q

      - name: Content and contracts
        run: |
          pnpm content:validate
          pnpm contracts:check

      - name: Production build
        run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inorganic_browser_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inorganic_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inorganic_browser_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inorganic_browser_test
      PUBLIC_ORIGIN: http://localhost:3000
      CORS_ORIGINS: '["http://localhost:3000"]'
      FORWARDED_ALLOW_IPS: 127.0.0.1
      API_PROXY_TARGET: http://127.0.0.1:8000
      SESSION_COOKIE_SECURE: "true"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: Strong-CI-Admin-Phrase-2026!
      SEED_USER_USERNAME: user
      SEED_USER_PASSWORD: Strong-CI-User-Phrase-2026!
      SEED_TESTER_USERNAME: tester
      SEED_TESTER_PASSWORD: Strong-CI-Tester-Phrase-2026!
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        run: uv --directory apps/api sync --frozen --extra test

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm --filter @inorganic/web build

      - name: Browser tests
        run: pnpm test:e2e
