AWSTemplateFormatVersion: '2010-09-09'
Description: Czech-only chem-app host in Frankfurt, managed by SSM.

Parameters:
  NetworkMode:
    Type: String
    Default: CreateVpc
    AllowedValues: [CreateVpc, ExistingVpc]
    Description: Create a dedicated public VPC or use an existing VPC and public subnet.
  ExistingVpcId:
    Type: String
    Default: ''
    AllowedPattern: '^(|vpc-[0-9a-f]+)$'
    Description: Required for ExistingVpc; the VPC containing ExistingPublicSubnetId.
  ExistingPublicSubnetId:
    Type: String
    Default: ''
    AllowedPattern: '^(|subnet-[0-9a-f]+)$'
    Description: Required for ExistingVpc; must have an internet-gateway route and available IPv4 addresses in eu-central-1.
  HostedZoneId:
    Type: String
    Default: Z0249271YTBB81ZE9N1U
  BootstrapRef:
    Type: String
    Default: main
    AllowedPattern: '[A-Za-z0-9._/-]+'
    Description: Repository branch or tag containing deploy/aws/bootstrap.sh.

Rules:
  RequireExistingNetworkIds:
    RuleCondition: !Equals [!Ref NetworkMode, ExistingVpc]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingVpcId, '']]
        AssertDescription: ExistingVpcId is required when NetworkMode is ExistingVpc.
      - Assert: !Not [!Equals [!Ref ExistingPublicSubnetId, '']]
        AssertDescription: ExistingPublicSubnetId is required when NetworkMode is ExistingVpc.
  OmitExistingNetworkIdsForNewVpc:
    RuleCondition: !Equals [!Ref NetworkMode, CreateVpc]
    Assertions:
      - Assert: !Equals [!Ref ExistingVpcId, '']
        AssertDescription: Leave ExistingVpcId empty when creating a VPC.
      - Assert: !Equals [!Ref ExistingPublicSubnetId, '']
        AssertDescription: Leave ExistingPublicSubnetId empty when creating a VPC.

Conditions:
  CreateNetwork: !Equals [!Ref NetworkMode, CreateVpc]

Resources:
  DedicatedVpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetwork
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: chem-app-vscht

  DedicatedInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetwork
    Properties:
      Tags:
        - Key: Name
          Value: chem-app-vscht

  DedicatedGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref DedicatedVpc
      InternetGatewayId: !Ref DedicatedInternetGateway

  DedicatedPublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref DedicatedVpc
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: chem-app-vscht-public

  DedicatedPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref DedicatedVpc

  DedicatedPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    DependsOn: DedicatedGatewayAttachment
    Properties:
      RouteTableId: !Ref DedicatedPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DedicatedInternetGateway

  DedicatedPublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    DependsOn: DedicatedPublicRoute
    Properties:
      SubnetId: !Ref DedicatedPublicSubnet
      RouteTableId: !Ref DedicatedPublicRouteTable

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CaddyDnsChallenge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
              - Effect: Allow
                Action: route53:GetChange
                Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsRecordTypes: TXT
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: _acme-challenge.vscht.vvojtisek.eu
                    route53:ChangeResourceRecordSetsActions: [CREATE, UPSERT, DELETE]

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # ExistingVpcId is intentionally an optional string selected by NetworkMode;
    # CloudFormation Rules validate its presence for ExistingVpc deployments.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      GroupDescription: HTTPS only; nftables applies Czech source filtering.
      VpcId: !If [CreateNetwork, !Ref DedicatedVpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  Host:
    Type: AWS::EC2::Instance
    # ExistingPublicSubnetId is intentionally conditional; the Rules block
    # validates the ID format and presence when ExistingVpc is selected.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: t4g.small
      IamInstanceProfile: !Ref HostProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !If [CreateNetwork, !Ref DedicatedPublicSubnet, !Ref ExistingPublicSubnetId]
          GroupSet: [!Ref HostSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: chem-app-vscht
        - Key: chem-app-stack
          Value: !Ref AWS::StackName
        - !If
          - CreateNetwork
          - Key: NetworkRouteAssociation
            Value: !Ref DedicatedPublicRouteAssociation
          - !Ref AWS::NoValue
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/chem-app-bootstrap.log) 2>&1
          dnf install -y git curl-minimal nftables docker python3 iproute
          install -d -m 755 /usr/local/lib/docker/cli-plugins /srv
          curl -fsSL https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-aarch64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          echo '49082844b87f03cdcd5f5bbef1ba8c9c897b7a2dfb80cea18d61ec8ca6117e0c  /usr/local/lib/docker/cli-plugins/docker-compose' | sha256sum -c -
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          git clone --depth 1 --branch '${BootstrapRef}' https://github.com/vvojtisek/chem-app.git /srv/chem-app
          /srv/chem-app/deploy/aws/bootstrap.sh

  PublicAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: chem-app-vscht

  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt PublicAddress.AllocationId
      InstanceId: !Ref Host

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: vscht.vvojtisek.eu.
      Type: A
      TTL: '300'
      ResourceRecords: [!Ref PublicAddress]

Outputs:
  NetworkMode:
    Value: !Ref NetworkMode
  VpcId:
    Value: !If [CreateNetwork, !Ref DedicatedVpc, !Ref ExistingVpcId]
  PublicSubnetId:
    Value: !If [CreateNetwork, !Ref DedicatedPublicSubnet, !Ref ExistingPublicSubnetId]
  InstanceId:
    Value: !Ref Host
  PublicIPv4:
    Value: !Ref PublicAddress
  Url:
    Value: https://vscht.vvojtisek.eu
